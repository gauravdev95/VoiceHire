services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    ports: ["8000:8000"]
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ["5173:80"]
    depends_on: [backend]
